{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Messages - Inbox</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/cb792c0850.js" crossorigin="anonymous"></script>
</head>
<body class="bg-light">
    <div class="container py-5" style="max-width: 600px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fa-solid fa-paper-plane me-2"></i>Inbox</h2>
            <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-sm">Back to Home</a>
        </div>

        <div class="list-group shadow-sm">
            {% for chat_user in chat_users %}
            <a href="{% url 'chat-detail' chat_user.username %}" class="list-group-item list-group-item-action d-flex align-items-center justify-content-between p-3">
                <div class="d-flex align-items-center">
                    <i class="fa-solid fa-user-circle fa-2x me-3 text-secondary"></i>
                    <div>
                        <h6 class="mb-0 fw-bold">@{{ chat_user.username }}</h6>
                        <small class="text-muted">Click to open conversation</small>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right text-muted"></i>
            </a>
            {% empty %}
            <div class="text-center py-5 bg-white rounded">
                <i class="fa-solid fa-comments fa-3x text-muted mb-3"></i>
                <p class="text-muted mb-0">No conversations yet.</p>
                <small class="text-muted">Visit a user's profile and click "Message" to start a chat!</small>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
