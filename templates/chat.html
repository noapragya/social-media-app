{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat with @{{ recipient.username }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/cb792c0850.js" crossorigin="anonymous"></script>
    <style>
        .chat-box { height: 400px; overflow-y: auto; background: #ffffff; border-radius: 8px; padding: 15px; }
        .message-sent { background-color: #0d6efd; color: white; align-self: flex-end; border-radius: 15px 15px 0 15px; }
        .message-received { background-color: #e9ecef; color: black; align-self: flex-start; border-radius: 15px 15px 15px 0; }
    </style>
</head>
<body class="bg-light">
    <div class="container py-4" style="max-width: 600px;">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <a href="{% url 'inbox' %}" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-arrow-left"></i> Inbox</a>
            <h5 class="mb-0">@{{ recipient.username }}</h5>
            <div></div>
        </div>

        <!-- Chat History -->
        <div class="chat-box border d-flex flex-column gap-2 mb-3 shadow-sm" id="chatBox">
            {% for msg in messages %}
                <div class="p-2 px-3 {% if msg.sender == request.user %}message-sent{% else %}message-received{% endif %}" style="max-width: 75%;">
                    <div>{{ msg.body }}</div>
                    <small style="font-size: 0.7rem;" class="opacity-75 d-block text-end mt-1">{{ msg.timestamp|date:"H:i" }}</small>
                </div>
            {% empty %}
                <div class="text-center my-auto text-muted">
                    <p>No messages yet. Say hi to @{{ recipient.username }}!</p>
                </div>
            {% endfor %}
        </div>

        <!-- Message Input Form -->
        <form method="POST" class="d-flex gap-2">
            {% csrf_token %}
            <input type="text" name="body" class="form-control" placeholder="Type a message..." required autocomplete="off">
            <button type="submit" class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i></button>
        </form>
    </div>

    <script>
        // Scroll chat box to bottom automatically
        var chatBox = document.getElementById("chatBox");
        chatBox.scrollTop = chatBox.scrollHeight;
    </script>
</body>
</html>
