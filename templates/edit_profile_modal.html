{% load static %}
<!-- Edit Profile Modal -->
<div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold" id="editProfileModalLabel"><i class="fa-solid fa-user-pen me-2"></i>Edit Profile</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form action="{% url 'edit-profile' %}" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="modal-body">
          
          <!-- Current Profile Pic Preview -->
          <div class="text-center mb-3">
            {% if user.profile.profileimg %}
              <img src="{{ user.profile.profileimg.url }}" class="rounded-circle mb-2" style="width: 90px; height: 90px; object-fit: cover;" alt="Current Profile Picture">
            {% else %}
              <img src="{% static 'images/default.jpg' %}" class="rounded-circle mb-2" style="width: 90px; height: 90px; object-fit: cover;" alt="Default Picture">
            {% endif %}
            <br>
            <label for="profile_img_input" class="btn btn-sm btn-outline-primary mt-1">
                <i class="fa-solid fa-camera me-1"></i> Change Photo
            </label>
            <input type="file" id="profile_img_input" name="image" accept="image/*" class="d-none">
          </div>

          <!-- Bio Input -->
          <div class="mb-3">
            <label for="bio" class="form-label fw-bold">Bio</label>
            <textarea class="form-control" id="bio" name="bio" rows="3" placeholder="Tell everyone something about yourself...">{{ user.profile.bio }}</textarea>
          </div>

          <!-- Location Input -->
          <div class="mb-3">
            <label for="location" class="form-label fw-bold">Location</label>
            <input type="text" class="form-control" id="location" name="location" value="{{ user.profile.location }}" placeholder="e.g. San Francisco, CA">
          </div>

        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary fw-bold">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>
